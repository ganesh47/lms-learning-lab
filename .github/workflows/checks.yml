name: Learning app checks
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, build/lending-systems-lab]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-validation
          path: |
            playwright-report
            test-results
            .evidence
          retention-days: 7
